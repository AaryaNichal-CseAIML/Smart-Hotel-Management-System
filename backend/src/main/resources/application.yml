server:
  port: 8080
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        same-site: LAX
        secure: false # set to true in production HTTPS

spring:
  application:
    name: royal-hotel-backend
  datasource:
    url: jdbc:mysql://localhost:3306/royal_hotel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# CORS configuration for frontend dev server
app:
  cors:
    allowed-origins: http://localhost:5173
